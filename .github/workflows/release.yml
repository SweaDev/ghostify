name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Build zips (default flavor)
        run: |
          bunx wxt zip
          bunx wxt zip -b firefox
      - name: Build zips (new tab flavor)
        env:
          GHOSTIFY_FLAVOR: newtab
        run: |
          bunx wxt zip
          bunx wxt zip -b firefox
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/*.zip --generate-notes
